# Builds the hardened container image and pushes it to GHCR so deployments pull
# a prebuilt image instead of compiling on the host. Runs on pushes to the
# pinned deploy branch and on manual dispatch.
name: build-image

on:
  push:
    branches: [deploy/v1.4.4-hardened]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nweii/things-cloud-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          # NAS runtime is linux/amd64; build only that to keep CI fast.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:v1.4.4-hardened
            ${{ env.IMAGE }}:${{ github.sha }}
